<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Andreas Holmstrom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cream: #faf8f4; --ink: #1a1a18; --ink-mid: #4a4a46; --ink-light: #8a8a84;
      --rule: #d8d4cc; --accent: #3a5a8a; --accent-light: #e8eef5;
      --serif: 'EB Garamond', Georgia, serif; --sans: 'DM Sans', system-ui, sans-serif;
    }
    html { scroll-behavior: smooth; }
    body { background: var(--cream); color: var(--ink); font-family: var(--serif); font-size: 17px; line-height: 1.75; }
    .page-wrap { max-width: 860px; margin: 0 auto; padding: 0 2rem; }
    nav { border-bottom: 1px solid var(--rule); position: sticky; top: 0; background: rgba(250,248,244,0.93); backdrop-filter: blur(6px); z-index: 100; }
    nav .page-wrap { display: flex; justify-content: space-between; align-items: center; padding-top: 1rem; padding-bottom: 1rem; }
    .nav-name { font-family: var(--serif); font-size: 1.05rem; letter-spacing: 0.02em; color: var(--ink); text-decoration: none; }
    .nav-links { display: flex; gap: 2rem; list-style: none; }
    .nav-links a { font-family: var(--sans); font-size: 0.8rem; font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-mid); text-decoration: none; transition: color 0.2s; }
    .nav-links a:hover, .nav-links a.active { color: var(--accent); }
    .page-header { padding: 4rem 0 3rem; border-bottom: 1px solid var(--rule); }
    .page-header h1 { font-family: var(--serif); font-size: clamp(2rem, 4vw, 2.8rem); font-weight: 400; line-height: 1.2; }
    section { padding: 3.5rem 0; border-bottom: 1px solid var(--rule); }
    section:last-of-type { border-bottom: none; }
    .section-label { font-family: var(--sans); font-size: 0.72rem; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-light); margin-bottom: 2rem; }
    p { margin-bottom: 1rem; }
    p:last-child { margin-bottom: 0; }
    .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2.5rem; }
    .contact-item .contact-label { font-family: var(--sans); font-size: 0.72rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-light); margin-bottom: 0.4rem; }
    .contact-item .contact-value { font-family: var(--serif); font-size: 1rem; }
    .contact-item .contact-value a { color: var(--accent); text-decoration: none; border-bottom: 1px solid transparent; transition: border-color 0.2s; }
    .contact-item .contact-value a:hover { border-color: var(--accent); }
    .profiles-list { list-style: none; margin-top: 0.5rem; }
    .profiles-list li { margin-bottom: 0.4rem; }
    .profiles-list a { font-family: var(--sans); font-size: 0.88rem; color: var(--accent); text-decoration: none; border-bottom: 1px solid transparent; transition: border-color 0.2s; }
    .profiles-list a:hover { border-color: var(--accent); }
    footer { padding: 2.5rem 0; border-top: 1px solid var(--rule); }
    footer p { font-family: var(--sans); font-size: 0.78rem; color: var(--ink-light); margin: 0; }
    @media (max-width: 640px) {
      .nav-links { gap: 1rem; }
      .contact-grid { grid-template-columns: 1fr; gap: 1.8rem; }
    }
  </style>
</head>
<body>

  <div class="page-wrap">

    <div class="page-header">
      <h1>Contact</h1>
    </div>

<section>
  <p class="section-label">Get in touch here</p>
  <form action="https://api.web3forms.com/submit" method="POST" style="max-width: 540px;">
    <input type="hidden" name="access_key" value="8b1deba8-f803-4f4c-a380-c45f0bdcda44">

    <div style="margin-bottom: 1.2rem;">
      <label style="display: block; font-family: 'DM Sans', sans-serif; font-size: 0.72rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: #8a8a84; margin-bottom: 0.4rem;">Name</label>
      <input type="text" name="name" required style="width: 100%; background: transparent; border: none; border-bottom: 1px solid #d8d4cc; padding: 0.4rem 0; font-family: 'EB Garamond', Georgia, serif; font-size: 1rem; color: #1a1a18; outline: none; transition: border-color 0.2s;" onfocus="this.style.borderColor='#3a5a8a'" onblur="this.style.borderColor='#d8d4cc'">
    </div>

    <div style="margin-bottom: 1.2rem;">
      <label style="display: block; font-family: 'DM Sans', sans-serif; font-size: 0.72rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: #8a8a84; margin-bottom: 0.4rem;">Email</label>
      <input type="email" name="email" required style="width: 100%; background: transparent; border: none; border-bottom: 1px solid #d8d4cc; padding: 0.4rem 0; font-family: 'EB Garamond', Georgia, serif; font-size: 1rem; color: #1a1a18; outline: none; transition: border-color 0.2s;" onfocus="this.style.borderColor='#3a5a8a'" onblur="this.style.borderColor='#d8d4cc'">
    </div>

    <div style="margin-bottom: 2rem;">
      <label style="display: block; font-family: 'DM Sans', sans-serif; font-size: 0.72rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: #8a8a84; margin-bottom: 0.4rem;">Message</label>
      <textarea name="message" required rows="5" style="width: 100%; background: transparent; border: none; border-bottom: 1px solid #d8d4cc; padding: 0.4rem 0; font-family: 'EB Garamond', Georgia, serif; font-size: 1rem; color: #1a1a18; outline: none; resize: none; transition: border-color 0.2s;" onfocus="this.style.borderColor='#3a5a8a'" onblur="this.style.borderColor='#d8d4cc'"></textarea>
    </div>

    <button type="submit" style="font-family: 'DM Sans', sans-serif; font-size: 0.82rem; letter-spacing: 0.04em; color: #faf8f4; background: #3a5a8a; border: none; padding: 0.6rem 1.4rem; border-radius: 2px; cursor: pointer; transition: opacity 0.2s;" onmouseover="this.style.opacity='0.85'" onmouseout="this.style.opacity='1'">Send message</button>
  </form>
</section>
